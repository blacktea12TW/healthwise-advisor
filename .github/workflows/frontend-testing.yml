name: Deploy Vite App

on:
  push:
    branches: ['main'] # Trigger on push to main branch

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
# Grant permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Use a modern Node version
          cache: 'npm'    # Caches npm dependencies for faster runs

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test --if-present # Runs your test script if defined in package.json

      - name: Build Vite App
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite builds to the /dist directory by default

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
