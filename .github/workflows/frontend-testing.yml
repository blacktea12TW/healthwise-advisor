name: Frontend CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得儲存庫的程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Bun 環境 (因為專案包含 bun.lock)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. 安裝專案依賴套件
      - name: Install dependencies
        run: bun install

      # 4. 執行 Linter (檢查語法與排版)
      - name: Run ESLint
        run: bun run lint # 請確認 package.json 中是否有 lint 指令

      # 5. 執行單元測試
      - name: Run Tests
        run: bun test # 或是 bun run test，取決於您的 package.json 設定
